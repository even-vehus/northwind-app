# docker-compose.yml
# Runs the React frontend (port 5173) and ASP.NET Core API (port 5000).
# The database is Fabric SQL — it is NOT containerised.
# Connection string and Entra ID config are read from a .env file (copy .env.example to .env).
#
# Usage:
#   cp .env.example .env          # fill in your values
#   docker compose up --build

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      # These override appsettings.json — values come from your .env file
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FabricSql: ${CONNECTIONSTRINGS__FABRICSQL}
      AzureAd__TenantId: ${AZUREAD__TENANTID}
      AzureAd__ClientId: ${AZUREAD__CLIENTID}
      AzureAd__Audience: ${AZUREAD__AUDIENCE}
      AllowedOrigins__0: http://localhost:5173
    restart: unless-stopped

  web:
    build:
      context: ./Northwind
      dockerfile: Dockerfile
      args:
        # These are baked in at build time by Vite
        VITE_API_BASE_URL: http://localhost:5000
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID}
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
