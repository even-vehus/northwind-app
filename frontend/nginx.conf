server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching of index.html so deployments are picked up
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
